name: Backend CD

on:
  workflow_run:
    workflows: ["main CI with backend"]
    types: [completed]
  workflow_dispatch:

env:
  ZONE: asia-northeast3-a

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - id: standby
        run: |
          VM=$(gcloud compute instances list \
            --filter="labels.role=standby" \
            --zones="${{ env.ZONE }}" \
            --format="value(name)")
          echo "vm=$VM" >> "$GITHUB_OUTPUT"

      - id: image
        run: |
          TAG=$(gcloud artifacts docker images list \
            "${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.PROJECT_REPOSITORY }}/${{ secrets.IMAGE_NAME }}" \
            --include-tags --sort-by="~UPDATE_TIME" --limit=1 \
            --format="value(TAGS)" | cut -d',' -f1)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - run: |
          cat > backend.env <<ENVEOF
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          KAKAO_REST_API_KEY=${{ secrets.KAKAO_REST_API_KEY }}
          KMA_SERVICE_KEY=${{ secrets.KMA_SERVICE_KEY }}
          SPOTIFY_CLIENT_ID=${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET=${{ secrets.SPOTIFY_CLIENT_SECRET }}
          GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}
          GCS_BUCKET_NAME=${{ secrets.GCS_BUCKET_NAME }}
          ENVEOF

      - run: |
          gcloud compute scp backend.env "${{ steps.standby.outputs.vm }}:~/app/backend.env" \
            --zone="${{ env.ZONE }}" --tunnel-through-iap

          gcloud compute ssh "${{ steps.standby.outputs.vm }}" --zone="${{ env.ZONE }}" --tunnel-through-iap --command="
            cd ~/app &&
            export IMAGE_TAG=${{ steps.image.outputs.tag }} &&
            docker compose pull backend &&
            docker compose up -d backend
          "

      - run: |
          gcloud compute ssh "${{ steps.standby.outputs.vm }}" --zone="${{ env.ZONE }}" --tunnel-through-iap --command="
            curl -fsS http://localhost:8080/actuator/health
          "

      - run: |
          ACTIVE_VM=$(gcloud compute instances list \
            --filter="labels.role=active" \
            --zones="${{ env.ZONE }}" \
            --format="value(name)")

          gcloud compute instances delete-access-config "$ACTIVE_VM" \
            --zone="${{ env.ZONE }}" --access-config-name="External NAT"

          gcloud compute instances add-access-config "${{ steps.standby.outputs.vm }}" \
            --zone="${{ env.ZONE }}" --access-config-name="External NAT" \
            --address="${{ secrets.MURO_PROD_IP }}"

          gcloud compute instances add-labels "${{ steps.standby.outputs.vm }}" --zone="${{ env.ZONE }}" --labels=role=active
          gcloud compute instances add-labels "$ACTIVE_VM" --zone="${{ env.ZONE }}" --labels=role=standby
