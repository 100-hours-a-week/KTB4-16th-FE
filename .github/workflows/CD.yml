name: Frontend CD

# CI(Frontend CI main)가 성공적으로 끝나면 자동으로 실행된다.
# workflow_dispatch는 CI 없이 재배포만 다시 시도하고 싶을 때 수동으로 쓰기 위한 것.
on:
  workflow_run:
    workflows: ["Frontend CI main"]
    types: [completed]
  workflow_dispatch:

env:
  ZONE: asia-northeast3-a

jobs:
  # ============================================================
  # 1단계 job: Standby VM에 새 버전을 자동으로 배포한다.
  # 스모크 테스트는 CI 쪽 테스트 코드로 대체하기로 해서 여기선 하지 않는다.
  # 이 job이 실패하면 switch-traffic job은 아예 시작되지 않고 승인 요청도 안 뜬다.
  # ============================================================
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # GCP WIF 인증용 OIDC 토큰 발급 권한
    outputs:
      standby_vm: ${{ steps.standby.outputs.vm }}   # switch-traffic job에서도 이 값을 써야 함
    steps:
      # WIF로 GCP 서비스 계정 인증 (키 파일 없이 임시 토큰 발급)
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # 1. 현재 role=standby 라벨이 붙은 VM을 찾는다.
      #    배포는 항상 Standby(트래픽 안 받는 쪽)에만 한다. Active는 여기서 절대 안 건드린다.
      - id: standby
        run: |
          VM=$(gcloud compute instances list \
            --filter="labels.role=standby" \
            --zones="${{ env.ZONE }}" \
            --format="value(name)")
          echo "vm=$VM" >> "$GITHUB_OUTPUT"

      # 2. CI(semantic-release)가 방금 push한 이미지 중 가장 최근 태그를 조회한다.
      #    CD는 이미지를 직접 빌드하지 않고, CI가 이미 push해둔 걸 그대로 가져다 쓴다.
      - id: image
        run: |
          TAG=$(gcloud artifacts docker images list \
            "${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.PROJECT_REPOSITORY }}/${{ secrets.IMAGE_NAME }}" \
            --include-tags --sort-by="~UPDATE_TIME" --limit=1 \
            --format="value(TAGS)" | cut -d',' -f1)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # 3. frontend.env 생성 자리
      #    TODO: 프론트엔드 개발 시작되면 실제 필요한 환경변수(NEXT_PUBLIC_API_BASE_URL,
      #    카카오맵 JS 키 등)로 채울 것. 지금은 개발 전이라 비워둠 —
      #    VM의 ~/app/frontend.env가 비어있어도 docker compose가 정상 동작하는지 확인 필요.

      # 4. Standby VM에서 새 이미지를 pull해서 frontend 컨테이너만 교체한다.
      #    같은 VM 위의 backend/ai/nginx 컨테이너는 건드리지 않는다.
      - run: |
          gcloud compute ssh "${{ steps.standby.outputs.vm }}" --zone="${{ env.ZONE }}" --tunnel-through-iap --command="
            cd ~/app &&
            export IMAGE_TAG=${{ steps.image.outputs.tag }} &&
            docker compose pull frontend &&
            docker compose up -d frontend
          "

  # ============================================================
  # 2단계 job: 실제 트래픽 전환 (Blue-Green Switch).
  # environment: production 이 붙어있어서, GitHub Settings에서 지정한 승인자가
  # Actions 탭에서 "Approve and deploy"를 눌러야만 이 job이 실행된다.
  # deploy가 실패하면 이 job은 아예 시작되지 않고 승인 요청도 안 뜬다.
  # ============================================================
  switch-traffic:
    needs: deploy
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # 6. 현재 role=active인 VM(지금까지 트래픽을 받던 VM)을 찾는다.
      # 7. 고정 IP를 Active VM에서 떼어내고 검증이 끝난 Standby VM에 붙인다.
      #    이 순간부터 실제 사용자 트래픽이 새 버전으로 넘어간다.
      # 8. 라벨을 서로 바꾼다 — 방금 전환된 VM이 새 active, 기존 active는 새 standby가 되어
      #    다음 배포 때 그쪽이 배포 대상이 된다.
      - run: |
          ACTIVE_VM=$(gcloud compute instances list \
            --filter="labels.role=active" \
            --zones="${{ env.ZONE }}" \
            --format="value(name)")
          STANDBY_VM="${{ needs.deploy.outputs.standby_vm }}"

          # ACTIVE와 STANDBY가 같으면 이미 전환됐거나 오래된 승인 요청이다 — 라벨/IP를 망가뜨리지 않도록 중단한다.
          if [ "$ACTIVE_VM" = "$STANDBY_VM" ]; then
            echo "ACTIVE_VM과 STANDBY_VM이 동일합니다 ($ACTIVE_VM). 이미 전환되었거나 오래된 승인 요청일 수 있어 중단합니다."
            exit 1
          fi

          gcloud compute instances delete-access-config "$ACTIVE_VM" \
            --zone="${{ env.ZONE }}" --access-config-name="External NAT"

          # Cloud NAT 미도입 상태라 standby가 자체 임시 외부 IP를 갖고 있을 수 있다.
          # 고정 IP를 붙이기 전에 기존 access-config를 먼저 제거한다 (없으면 무시하고 진행).
          gcloud compute instances delete-access-config "$STANDBY_VM" \
            --zone="${{ env.ZONE }}" --access-config-name="External NAT" || true

          gcloud compute instances add-access-config "$STANDBY_VM" \
            --zone="${{ env.ZONE }}" --access-config-name="External NAT" \
            --address="${{ secrets.MURO_PROD_IP }}"

          gcloud compute instances add-labels "$STANDBY_VM" --zone="${{ env.ZONE }}" --labels=role=active
          gcloud compute instances add-labels "$ACTIVE_VM" --zone="${{ env.ZONE }}" --labels=role=standby

          # 방금 standby가 된 VM(옛 active)은 고정 IP를 뗀 채로 남는다.
          # Cloud NAT이 없는 상태라 이대로 두면 다음 배포 때 이미지 pull이 안 되므로,
          # 임시(ephemeral) 외부 IP를 다시 붙여서 인터넷 접속을 유지시켜준다.
          gcloud compute instances add-access-config "$ACTIVE_VM" \
            --zone="${{ env.ZONE }}" --access-config-name="External NAT"
