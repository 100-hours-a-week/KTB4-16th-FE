name: Frontend CI feature

on:
  push:
    branches:
      - feature
      

jobs:
  ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v7
        
      # 2. Node.js  (캐싱 포함)
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # 3. 의존성 설치    
      - name: Install dependencies
        run: npm ci      

      # Phase 1: Prettier (ESlint)
      - name: Run Prettier 
        run: npm run Prettier

      # Phase 2: Lint (ESlint)
      - name: Run ESlint
        run: npm run lint
