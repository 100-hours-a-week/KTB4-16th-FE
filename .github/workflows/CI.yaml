name: Frontend CI develop

on:
  pull_request:
    branches:
      - develop
      

jobs:
  ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v7
        
      # 2. Node.js  (캐싱 포함)
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # 3. 의존성 설치    
      - name: Install dependencies
        run: npm ci      

      # Phase 1: Prettier (ESlint)
      - name: Run prettier 
        run: npm run prettier

      # Phase 2: Lint (ESlint)
      - name: Run ESlint
        run: npm run lint
      

      # Phase 3: TypeScript 타입 오류 검사
      - name: Typecheck
        run: npm run typecheck

  notify:
      name: Discord notification
      runs-on: ubuntu-latest
      needs: ci

      # CI가 실패해도 알림 작업 실행
      if: ${{ always() }}
      permissions: {}

      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

      steps:
        - name: Send CI result to Discord
          if: ${{ env.DISCORD_WEBHOOK != '' }}
          uses: Ilshidur/action-discord@0.3.2
          with:
            args: "Frontend develop CI 결과 알림"
          env:
            DISCORD_USERNAME: MURO_BOT
            DISCORD_EMBEDS: |
              [
                {
                  "title": "Frontend develop CI: ${{ needs.ci.result }}",
                  "description": ${{ toJSON(github.event.pull_request.title) }},
                  "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                  "color": ${{ needs.ci.result == 'success' && 3066993 || 15158332 }},
                  "fields": [
                    {
                      "name": "PR",
                      "value": "[#${{ github.event.pull_request.number }}](${{ github.event.pull_request.html_url }})",
                      "inline": true
                    },
                    {
                      "name": "작성자",
                      "value": ${{ toJSON(github.event.pull_request.user.login) }},
                      "inline": true
                    },
                    {
                      "name": "작업 브랜치",
                      "value": ${{ toJSON(github.head_ref) }},
                      "inline": true
                    },
                    {
                      "name": "대상 브랜치",
                      "value": ${{ toJSON(github.base_ref) }},
                      "inline": true
                    }
                  ]
                }
              ]
