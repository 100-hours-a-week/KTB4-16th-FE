name: Frontend CI main

on:
  push:
    branches:
      - main
      
# 버전 작업 동시에 실행되지 않게 
concurrency:
  group: frontend-main-release
  cancel-in-progress: false

jobs:
  ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    # 워크플로우 권한 정의
    permissions:
      contents: write      # Git 태그, Release 생성
      id-token: write      # GCP Workload Identity와 통신하기 위한 OIDC 토큰 발행 권한

    env:
      IMAGE_BASE: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.PROJECT_REPOSITORY }}/${{ secrets.IMAGE_NAME }}

    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v7
        with:
            fetch-depth: 0

      # 2. Node.js 
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # 3. 의존성 설치    
      - name: Install dependencies
        run: npm ci      

      # Phase 1: Prettier
      - name: Run prettier 
        run: npm run prettier

      # Phase 2: Lint (ESlint)
      - name: Run ESlint
        run: npm run lint

      # Phase 3: TypeScript 타입 오류 검사
      - name: Typecheck
        run: npm run typecheck

      # Phase 4: Build
      - name: Build
        run: npm run build

      # Phase 5: Docker Build 준비
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Phase 6: OIDC를 이용한 서비스 계정 인증
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER}}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      # Phase 7: gcloud 명령어 사용 준비
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        

      # Phase 8: Docker가 GCP 인증 정보를 사용하도록 연결
      - name: Configure Docker authentication
        run: |
            gcloud auth configure-docker "${{ secrets.GCP_REGION }}-docker.pkg.dev" --quiet

      # Phase 9: 버전 계산 -> image build, push -> Git 태그, Release 생성
      - name: Release frontend image
        env:
          GITHUB_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: |
          npx --yes \
            --package=semantic-release@25 \
            --package=@semantic-release/exec@7 \
            semantic-release

  notify:
      name: Discord notification
      runs-on: ubuntu-latest
      needs: ci

      # CI가 실패해도 알림 작업 실행
      if: ${{ always() }}
      permissions: {}

      env:
        DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

      steps:
        - name: Send CI result to Discord
          if: ${{ env.DISCORD_WEBHOOK != '' }}
          uses: Ilshidur/action-discord@0.3.2
          with:
            args: "Frontend main CI 결과 알림"
          env:
            DISCORD_USERNAME: MURO_BOT
            DISCORD_EMBEDS: |
              [
                {
                  "title": "Frontend CI: ${{ needs.ci.result }}",
                  "description": ${{ toJSON(github.event.head_commit.message || '커밋 메시지 없음') }},
                  "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                  "color": ${{ needs.ci.result == 'success' && 3066993 || 15158332 }},
                  "fields": [
                    {
                      "name": "커밋",
                      "value": "[커밋 확인](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})",
                      "inline": true
                    },
                    {
                      "name": "푸시한 사람",
                      "value": ${{ toJSON(github.actor) }},
                      "inline": true
                    },
                    {
                      "name": "브랜치",
                      "value": ${{ toJSON(github.ref_name) }},
                      "inline": true
                    }
                  ]
                }
              ]

